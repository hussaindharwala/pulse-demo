// FORMATTERS — Indian locale (lakhs / crores)
// =====================================================================
const fmtIN = (n) => {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1_00_00_000) return (n / 1_00_00_000).toFixed(2).replace(/\.?0+$/, '') + ' Cr';
  if (a >= 1_00_000)    return (n / 1_00_000).toFixed(2).replace(/\.?0+$/, '') + ' L';
  if (a >= 1_000)       return (n / 1_000).toFixed(1).replace(/\.0$/, '') + ' K';
  return Math.round(n).toString();
};
const rupee = (n) => '₹' + fmtIN(n);
const fmtINR = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const fmtDate = (d) => {
  const x = (d instanceof Date) ? d : new Date(d);
  return x.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
};
const isoDate = (d) => (d instanceof Date ? d : new Date(d)).toISOString().split('T')[0];

// =====================================================================
// EXPORT-TO-EXCEL HELPER (CSV download — opens in Excel)
// =====================================================================
const exportCSV = (filename, rows) => {
  if (!rows || rows.length === 0) return;
  const cols = Object.keys(rows[0]);
  const esc = (v) => {
    if (v === null || v === undefined) return '';
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [cols.join(','), ...rows.map(r => cols.map(c => esc(r[c])).join(','))].join('\n');
  const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
};

const ExportButton = ({ filename, rows, label = 'Export' }) => (

// Fixes v1.1 overflow issue across all viewports.
// =====================================================================
const InfoButton = ({ info }) => {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [open]);
  return (
    <>
      <button
        onClick={(e) => { e.stopPropagation(); setOpen(true); }}
        className="w-5 h-5 rounded-full border hairline flex items-center justify-center text-[10px] font-medium bg-card text-muted hover:text-ink hover:border-muted transition shrink-0"
        aria-label="Data lineage and definition"
      >i</button>
      {open && (
        <>
          <div className="modal-backdrop anim-fade" onClick={() => setOpen(false)} />
          <div className="modal-shell" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-start justify-between gap-3 mb-2">
              <div className="display text-[15px] font-medium leading-snug">{info.title}</div>
              <button onClick={() => setOpen(false)} className="text-paper/60 hover:text-paper text-2xl leading-none -mt-1.5 -mr-1 px-1.5">×</button>
            </div>

              </div>
            )}
          </div>
        </>
      )}
    </>
  );
};

const Sparkline = ({ data, color='#0F766E', width=80, height=22 }) => {
  if (!data || data.length === 0) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const span = max - min || 1;
  const step = width / (data.length - 1);
  const pts = data.map((v,i) => `${i*step},${height-((v-min)/span)*(height-2)-1}`).join(' ');
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} className="inline-block">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={(data.length-1)*step} cy={height-((data[data.length-1]-min)/span)*(height-2)-1} r="1.8" fill={color}/>
    </svg>
  );
};

const KpiTile = ({ id, label, value, delta, deltaSuffix='%', sparkData, status='ok', sub, onClick, info, deltaDirGood='up' }) => {
  const bandColor = status==='red'?'bg-bad':status==='amber'?'bg-warn':'bg-ok';
  const sparkColor = status==='red'?'#B91C1C':status==='amber'?'#B45309':'#0F766E';
  const deltaUp = delta > 0;
  const goodDir = deltaDirGood==='up' ? deltaUp : !deltaUp;
  const deltaColor = delta===0 ? 'text-muted' : goodDir ? 'text-ok' : 'text-bad';
  return (
    <div className="bg-card border hairline rounded-2xl tile cursor-pointer relative overflow-visible" onClick={onClick}>
      <div className={`absolute left-0 top-0 bottom-0 w-1 ${bandColor} rounded-l-2xl`} />
      <div className="p-4 sm:p-5">
        <div className="flex items-start justify-between gap-2">
          <div className="text-[11px] sm:text-xs text-muted uppercase tracking-wider font-medium">{label}</div>
          <div className="flex items-center gap-1.5" onClick={(e)=>e.stopPropagation()}>
            {info && <InfoButton info={info} />}
            <StatusDot s={status} />
          </div>
        </div>
        <div className="mt-1.5 flex items-baseline gap-2">
          <div className="display text-3xl sm:text-4xl font-medium num text-ink">{value}</div>
        </div>
        {sub && <div className="text-[11px] text-muted mt-0.5">{sub}</div>}
        <div className="mt-3 flex items-end justify-between gap-2">
          <div className={`text-xs ${deltaColor} mono flex items-center gap-1`}>
            <span>{delta>0?'↑':delta<0?'↓':'·'}</span>
            <span>{Math.abs(delta).toFixed(0)}{deltaSuffix}</span>
            <span className="text-muted">vs prior</span>
          </div>
          {sparkData && <Sparkline data={sparkData} color={sparkColor} />}
        </div>
      </div>
    </div>
  );
};

// SALES VIEW — v1.2 major changes:
//   • Net Sales chart: 3 lines (Brand, LifeJoy, Combined)
//   • Range filters: Daily / Weekly / Monthly + From / To date inputs

//     MedicaSaleTransaction.jpeg screen)

// Helper: build series — Daily / Weekly / Monthly aggregations
const buildSalesSeries = (range, fromISO, toISO, scale) => {
  // synthesize 90 days of daily data anchored on real April MTD
  const days = [];
  const start = new Date('2026-02-17');
  const reayDailyAvg = 6_14_12_31.5;
  for (let i = 0; i < 90; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const dow = d.getDay();
    // weekday/weekend rhythm + month-end push
    const dayMul = (dow===0?0.78:dow===6?1.05:1.0) * (1 + 0.08*Math.sin(i*0.4)) * (i>=14 && i<28 ? 1.12 : 1.0);
    const combined = reayDailyAvg * dayMul * scale;
    const lj = combined * (0.082 + 0.018*Math.sin(i*0.27));
    const brand = combined - lj;
    days.push({ date: new Date(d), combined, lj, brand });
  }
  // filter by date range
  const fd = new Date(fromISO), td = new Date(toISO);
  const filtered = days.filter(d => d.date >= fd && d.date <= td);
  // aggregate
  if (range === 'Daily') return filtered.map(d => ({ label: fmtDate(d.date), combined:d.combined, lj:d.lj, brand:d.brand, raw:d.date }));
  if (range === 'Weekly') {
    const buckets = new Map();
    for (const d of filtered) {
      const ws = new Date(d.date);
      const day = ws.getDay(); const off = day===0?6:day-1;
      ws.setDate(ws.getDate()-off); ws.setHours(0,0,0,0);
      const key = ws.getTime();
      if (!buckets.has(key)) buckets.set(key, { ws:new Date(ws), combined:0, lj:0, brand:0 });
      const b = buckets.get(key); b.combined += d.combined; b.lj += d.lj; b.brand += d.brand;
    }
    return [...buckets.values()].sort((a,b)=>a.ws-b.ws).map(b => ({ label:`W of ${fmtDate(b.ws)}`, ...b, raw:b.ws }));
  }
  // Monthly
  const buckets = new Map();
  for (const d of filtered) {
    const key = `${d.date.getFullYear()}-${d.date.getMonth()}`;
    if (!buckets.has(key)) buckets.set(key, { mDate:new Date(d.date.getFullYear(), d.date.getMonth(), 1), combined:0, lj:0, brand:0 });
    const b = buckets.get(key); b.combined += d.combined; b.lj += d.lj; b.brand += d.brand;
  }
  return [...buckets.values()].sort((a,b)=>a.mDate-b.mDate).map(b => ({ label:b.mDate.toLocaleDateString('en-IN',{month:'short',year:'2-digit'}), ...b, raw:b.mDate }));
};

// =====================================================================
// SalesTrendCard — v1.3 redesign
// • Stacked-area layout: Brand (ink) at bottom, LifeJoy (teal) on top
//   — both readable at any zoom; total = top edge
// • Smooth Catmull-Rom-style cubic interpolation for daily; straight for
//   weekly/monthly (where each bucket is a real data point)
// • Hover crosshair tooltip with date + all three values + delta vs avg
// • Period-aware x-axis labels (DD MMM, "W of …", MMM YY)
// • Avg reference line, peak/trough markers
// • Mobile-first: SVG uses xMidYMid meet so it never stretches
// =====================================================================
const SalesTrendCard = ({ branch }) => {
  const scale = scaleFor(branch);
  const [range, setRange] = useState('Daily');
  const [from, setFrom] = useState('2026-04-01');
  const [to, setTo] = useState('2026-04-30');
  const [hover, setHover] = useState(null);

  const series = useMemo(() => buildSalesSeries(range, from, to, scale), [range, from, to, scale]);

  // Aspect ratio chosen so on a 360px mobile width the chart is ~144px tall,
  // and on desktop ~320px tall — comfortable for either.
  const W = 800, H = 320;
  const padL = 56, padR = 20, padT = 24, padB = 44;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  const max = Math.max(...series.map(d => d.combined), 1);
  const yMax = max * 1.10;
  const x = (i) => padL + (i / Math.max(1, series.length - 1)) * innerW;
  const y = (v) => padT + innerH - (v / yMax) * innerH;

  // Smooth Catmull-Rom → cubic Bezier for Daily; straight segments otherwise
  const smoothPath = (key) => {
    if (series.length < 2) return '';
    const pts = series.map((d, i) => [x(i), y(d[key])]);
    const smooth = range === 'Daily' && series.length > 4;
    let path = `M ${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`;
    if (!smooth) {
      for (let i = 1; i < pts.length; i++) {
        path += ` L ${pts[i][0].toFixed(2)} ${pts[i][1].toFixed(2)}`;
      }
      return path;
    }
    const t = 0.5;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const cp1x = p1[0] + (p2[0] - p0[0]) * (t / 6);
      const cp1y = p1[1] + (p2[1] - p0[1]) * (t / 6);
      const cp2x = p2[0] - (p3[0] - p1[0]) * (t / 6);
      const cp2y = p2[1] - (p3[1] - p1[1]) * (t / 6);
      path += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
    }
    return path;
  };

  const combinedPath = smoothPath('combined');
  const brandPath = smoothPath('brand');

  // Brand area: from x-axis up to brand line
  const brandAreaPath = `${brandPath} L ${x(series.length - 1).toFixed(2)} ${(padT + innerH).toFixed(2)} L ${padL.toFixed(2)} ${(padT + innerH).toFixed(2)} Z`;

  // LifeJoy stacked area: between brand line and combined line. Build by
  // tracing combined forward, then brand backward.
  const ljStackedAreaPath = (() => {
    let p = combinedPath;
    // Last x stays the same; drop down to brand at last point, then walk back
    p += ` L ${x(series.length - 1).toFixed(2)} ${y(series[series.length - 1].brand).toFixed(2)}`;
    for (let i = series.length - 2; i >= 0; i--) {
      p += ` L ${x(i).toFixed(2)} ${y(series[i].brand).toFixed(2)}`;
    }
    p += ' Z';
    return p;
  })();

  // Totals
  const totalCombined = series.reduce((s, d) => s + d.combined, 0);
  const totalBrand    = series.reduce((s, d) => s + d.brand, 0);
  const totalLJ       = series.reduce((s, d) => s + d.lj, 0);
  const ljShare = totalCombined > 0 ? totalLJ / totalCombined * 100 : 0;
  const avgPerBucket = totalCombined / Math.max(1, series.length);

  // Peak / trough
  const peakIdx = series.reduce((acc, d, i) => d.combined > series[acc].combined ? i : acc, 0);
  const troughIdx = series.reduce((acc, d, i) => d.combined < series[acc].combined ? i : acc, 0);

  // X-axis labels
  const xLabelCount = range === 'Daily'
    ? Math.min(6, series.length)
    : range === 'Weekly'
      ? Math.min(series.length, 8)
      : series.length;
  const xLabelIdx = series.length <= xLabelCount
    ? series.map((_, i) => i)
    : Array.from({ length: xLabelCount }, (_, k) =>
        Math.round(k * (series.length - 1) / (xLabelCount - 1)));

  const xLabelText = (d) => {
    if (!d || !d.raw) return '';
    if (range === 'Monthly') return d.raw.toLocaleDateString('en-IN', { month: 'short', year: '2-digit' });
    return d.raw.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  };

  const yTicks = [0, 0.33, 0.67, 1].map(t => ({ v: yMax * t, y: y(yMax * t) }));
  const avgY = y(avgPerBucket);

  // Hover
  const svgRef = useRef(null);
  const onMove = (e) => {
    if (!svgRef.current) return;
    const r = svgRef.current.getBoundingClientRect();
    const sx = (e.clientX - r.left) * (W / r.width);
    const i = Math.round((sx - padL) / innerW * (series.length - 1));
    if (i >= 0 && i < series.length) setHover(i);
    else setHover(null);
  };

  const exportRows = series.map(d => ({
    Period: d.label,
    'Brand (₹)': Math.round(d.brand),
    'LifeJoy (₹)': Math.round(d.lj),
    'Combined (₹)': Math.round(d.combined),
  }));

  const info = {
    title: 'Net Sales · Trend',

            </div>

      <div className="px-5 pb-4 pt-2 flex flex-wrap items-center justify-between gap-3 text-[11px] border-t hairline">

};

// ---------- helpers
const groupByPeriod = (rows, range, dateKey, amtKey, extra={}) => {
  // rows have date + amt fields; aggregate to Daily / Weekly / Monthly
  if (range === 'Daily') return rows;
  const buckets = new Map();
  for (const r of rows) {
    const d = new Date(r[dateKey]);
    let key;
    if (range === 'Weekly') {
      const ws = new Date(d);
      const off = ws.getDay()===0 ? 6 : ws.getDay()-1;
      ws.setDate(ws.getDate()-off); ws.setHours(0,0,0,0);
      key = ws.toISOString().split('T')[0];
    } else {
      key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
    }
    if (!buckets.has(key)) {
      buckets.set(key, { date:key, amt:0, n:0, bounce_amt:0, bounce_n:0 });
    }
    const b = buckets.get(key);
    b.amt += r.amt; b.n += r.n;
    if (r.bounce_amt) b.bounce_amt += r.bounce_amt;
    if (r.bounce_n) b.bounce_n += r.bounce_n;
  }
  return [...buckets.values()].sort((a,b) => a.date < b.date ? -1 : 1);
};

// =====================================================================
// CASH-FLOW FORECAST — NEW v1.2 widget
// Hussain's spec:
//   Today's BankBal + Today's Receivables (cheque) − Today's Payables (cheque)
//   = Expected closing balance
//   Range filter: Daily / Weekly / Monthly
//   Sources: PDC customer (receivables), PDC supplier (payables — synthesized
//   per Hussain note: we don't yet have direct supplier-PDC data)
// =====================================================================
const CashFlowForecastCard = ({ branch }) => {
  const scale = scaleFor(branch);
  const [range, setRange] = useState('Weekly');

  // Opening bank balance (from Medica snapshot at -28.5 Cr negative — but for
  // this widget we use a moderately positive demo balance so the forecast
  // shape is readable. In production this pulls from a current-balance API.)
  const openingBalance = 12_50_000 * scale;

  // Real receivables daily series
  const recvDaily = REAL.master.pdc_customer.daily.map(d => ({
    date: d.date, amt: d.amt * scale, n: d.n,
  }));
  // Synthetic payables — Hussain noted no direct data yet. We approximate
  // as a flatter, less spiky series, averaging ~65% of receivables (cheque-
  // only, ignoring cash/UPI/NEFT) with weekly settlement spikes.
  const payDaily = recvDaily.map((d, i) => ({
    date: d.date,
    amt: d.amt * 0.65 * (1 + 0.3 * Math.sin(i*0.5)),
    n: Math.round(d.n * 0.4),
  }));

  // Aggregate per range
  const ragg = groupByPeriod(
    recvDaily.map(d => ({ ...d, bounce_amt:0, bounce_n:0 })),
    range, 'date', 'amt'
  );
  const pagg = groupByPeriod(
    payDaily.map(d => ({ ...d, bounce_amt:0, bounce_n:0 })),
    range, 'date', 'amt'
  );
  // Merge into a single forecast series
  const dates = [...new Set([...ragg.map(r=>r.date), ...pagg.map(p=>p.date)])].sort();
  let running = openingBalance;
  const forecast = dates.map(date => {
    const r = ragg.find(x => x.date === date)?.amt || 0;
    const p = pagg.find(x => x.date === date)?.amt || 0;
    const net = r - p;
    running += net;
    return { date, recv:r, pay:p, net, balance:running };
  });

  const minBal = Math.min(...forecast.map(f=>f.balance), openingBalance);
  const maxBal = Math.max(...forecast.map(f=>f.balance), openingBalance);
  const endBalance = forecast.length>0 ? forecast[forecast.length-1].balance : openingBalance;
  const peakDip = forecast.reduce((min, f) => f.balance < min.balance ? f : min, { balance: Infinity, date:'' });

  // Chart geometry
  const W = 700, H = 200;
  const padL = 50, padR = 16, padT = 12, padB = 30;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const span = (maxBal - minBal) || 1;
  const x = (i) => padL + (i/(Math.max(1, forecast.length-1)))*innerW;
  const y = (v) => padT + innerH - ((v - minBal)/span)*innerH;
  const zeroY = y(0);
  const linePath = forecast.map((f,i) => `${i===0?'M':'L'} ${x(i)} ${y(f.balance)}`).join(' ');

  const exportRows = forecast.map(f => ({
    Period: f.date,
    'Receivables (₹)': Math.round(f.recv),
    'Payables (₹)': Math.round(f.pay),
    'Net (₹)': Math.round(f.net),
    'Closing balance (₹)': Math.round(f.balance),
  }));

  const info = {
    title: 'Cash-flow forecast · cheque-only',
    what: 'Forward-looking bank balance projection. For each period: opening balance + expected cheque inflow (customer PDC) − expected cheque outflow (supplier PDC) = closing balance. Daily, weekly and monthly views supported.',
    source: 'Customer PDC: PDC_PHARMA + PDC_LIFEJOY (NetAmt by ChqDate). Supplier PDC: synthesized (no direct file yet — listed in 26-Apr meeting open questions as a Medica API requirement).',
    caveat: 'Per spec: cash, UPI, NEFT and other modes are deliberately EXCLUDED for now. Opening balance is illustrative ₹12.5 L; production will read live bank position.',
  };

  return (
    <Card className="overflow-hidden">
      <div className="px-5 pt-5 pb-4 border-b hairline">
        <div className="flex flex-wrap items-start justify-between gap-3">
          <div>
            <div className="flex items-center gap-2">
              <span className="text-[11px] uppercase tracking-wider text-muted font-medium">Forward cash · cheque only</span>
              <InfoButton info={info} />
            </div>
            <div className="flex items-baseline gap-3 mt-1.5">
              <div className="display text-[28px] font-medium num leading-none">{rupee(endBalance)}</div>
              <div className="text-[11.5px] text-muted">end of {range.toLowerCase()} horizon</div>
            </div>
            <div className="flex items-center gap-3 mt-1.5 text-[11px]">
              <span className="text-muted">Opening: <span className="num text-ink">{rupee(openingBalance)}</span></span>
              {peakDip.balance < openingBalance && (
                <span className="text-bad mono">↓ low on {fmtDate(peakDip.date)}: {rupee(peakDip.balance)}</span>
              )}
            </div>
          </div>
          <div className="flex flex-col items-end gap-2">
            <RangePills value={range} onChange={setRange} />
            <ExportButton filename={`cash_forecast_${range.toLowerCase()}.csv`} rows={exportRows} />
          </div>
        </div>
      </div>

      {/* Forecast line chart + flow bars */}
      <div className="px-3 sm:px-5 pt-3 pb-2">
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height:200 }} preserveAspectRatio="none">
          {/* zero line */}
          {minBal < 0 && (
            <line x1={padL} x2={W-padR} y1={zeroY} y2={zeroY} stroke="#B91C1C" strokeWidth="1" strokeDasharray="3,3" opacity="0.5"/>
          )}
          {/* horizontal grid */}
          {[0, 0.5, 1].map((t,i) => {
            const yv = padT + innerH - innerH*t;
            return (
              <g key={i}>
                <line x1={padL} x2={W-padR} y1={yv} y2={yv} stroke="#EDEAE2" strokeWidth="1" strokeDasharray={t===0?'0':'2,3'}/>
                <text x={padL-6} y={yv+4} fontSize="10" fill="#9CA3AF" textAnchor="end" className="mono">{fmtIN(minBal + span*t)}</text>
              </g>
            );
          })}
          {/* opening balance reference */}
          <line x1={padL} x2={W-padR} y1={y(openingBalance)} y2={y(openingBalance)}
            stroke="#0F766E" strokeWidth="1" strokeDasharray="4,3" opacity="0.45"/>
          <text x={padL+6} y={y(openingBalance)-4} fontSize="9.5" fill="#0F766E" opacity="0.7">opening</text>
          {/* line */}
          <path d={linePath} fill="none" stroke="#1A1F2C" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          {/* dots */}
          {forecast.map((f,i) => (
            <g key={i}>
              <circle cx={x(i)} cy={y(f.balance)} r="2.5" fill={f.balance<openingBalance?'#B91C1C':'#0F766E'}/>
            </g>
          ))}
          {/* x labels */}
          {forecast.map((f,i) => i % Math.max(1, Math.floor(forecast.length/6)) === 0 && (
            <text key={i} x={x(i)} y={H-10} fontSize="9.5" fill="#9CA3AF" textAnchor="middle" className="mono">
              {range==='Daily' ? new Date(f.date).getDate()+'/'+(new Date(f.date).getMonth()+1)
                : range==='Weekly' ? 'W'+new Date(f.date).getDate()
                : new Date(f.date).toLocaleDateString('en-IN',{month:'short'})}
            </text>
          ))}
        </svg>
      </div>

      {/* Flow summary cards */}
      <div className="border-t hairline grid grid-cols-3 text-center">
        <div className="px-3 py-3">
          <div className="text-[10px] uppercase tracking-wider text-muted font-medium">Inflow (recv)</div>
          <div className="num text-[15px] font-medium mt-1 text-ok">{rupee(forecast.reduce((s,f)=>s+f.recv,0))}</div>
        </div>
        <div className="border-l border-r hairline px-3 py-3">
          <div className="text-[10px] uppercase tracking-wider text-muted font-medium">Outflow (pay)</div>
          <div className="num text-[15px] font-medium mt-1 text-bad">{rupee(forecast.reduce((s,f)=>s+f.pay,0))}</div>
        </div>
        <div className="px-3 py-3">
          <div className="text-[10px] uppercase tracking-wider text-muted font-medium">Net</div>
          <div className={`num text-[15px] font-medium mt-1 ${endBalance >= openingBalance ? 'text-ok' : 'text-bad'}`}>
            {rupee(endBalance - openingBalance)}
          </div>
        </div>
      </div>
    </Card>
  );
};

              const yv = padT+innerH - innerH*t;

              const total = b.own_amt + b.third_amt;

              return (
                <g key={b.label}>
                  <rect x={cx-barWidth/2} y={baseY-totalH} width={barWidth} height={thirdH} fill="#1A1F2C" rx="2"/>
                  <rect x={cx-barWidth/2} y={baseY-ownH} width={barWidth} height={ownH} fill={isUrgent?'#B91C1C':'#0F766E'} rx="2"/>

          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 bg-bad rounded-sm"></span>Own — urgent (≤60d)</span>
          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 bg-ink rounded-sm"></span>Third-party</span>
        </div>
      </Card>
    </>
  );
};

// =====================================================================
// SiVsSoComparisonCard — v1.3 redesign per 26-Apr feedback
// Operational control panel for manual stock movement audit.
//
// Status rules:
//   🟢 GREEN  — SO == SI within 5% (or fully matched)
//   🟠 ORANGE — SI > SO   (suspicious / excess receipts)
//   🔴 RED    — SO > SI   (real leakage — pending stock return)
//
// Three operational layers:
//   1. Headline — net leakage, matched, red, orange (with status tiles)
//   2. Reason matrix — clickable, filters product feed
//   3. Product-level table — Product, SO Qty, SI Qty, Diff, Reason,
//      Username, Latest entry date, colour-coded row.
//   4. User accountability — return-rate scorecard per user
// =====================================================================

// Small reusable colour token for status (DRY)
const STATUS_TOKENS = {
  green:  { dot: 'bg-ok',     ring: 'border-ok/30',   chip: 'bg-ok/10 text-ok',     row: 'bg-ok/5 border-l-2 border-ok',     label: 'MATCHED'   },
  orange: { dot: 'bg-warn',   ring: 'border-warn/30', chip: 'bg-warn/10 text-warn', row: 'bg-warn/5 border-l-2 border-warn', label: 'SI > SO'   },
  red:    { dot: 'bg-bad',    ring: 'border-bad/30',  chip: 'bg-bad/10 text-bad',   row: 'bg-bad/5 border-l-2 border-bad',   label: 'SO > SI'   },
};
const labelFor = (s, soAmt, siAmt) => {
  if (s === 'green') return 'MATCHED';
  if (s === 'orange') return siAmt > 0 && soAmt === 0 ? 'IN ONLY' : 'SI > SO';
  return soAmt > 0 && siAmt === 0 ? 'OUT ONLY' : 'SO > SI';
};

const SiVsSoComparisonCard = ({ branch }) => {
  const scale = scaleFor(branch);
  const matrix = REAL.stockio.reason_matrix;
  const products = REAL.stockio.products;
  const users = REAL.stockio.users;
  const totals = REAL.stockio.totals;

  // Tab state
  const [tab, setTab] = useState('mismatches'); // mismatches | matched | all
  const [activeReason, setActiveReason] = useState(null);
  const [activeUser, setActiveUser] = useState(null);

  // Scale-applied totals
  const totalSO  = totals.so_amt * scale;
  const totalSI  = totals.si_amt * scale;
  const netLeak  = totals.net_leakage * scale;
  const matched  = totals.matched_amt * scale;
  const redLeak  = totals.red_leakage * scale;
  const orangeEx = totals.orange_excess * scale;

  // Filter products by tab + active reason + active user
  const filteredProducts = useMemo(() => {
    let out = products;
    if (tab === 'mismatches') out = out.filter(p => p.status !== 'green');
    else if (tab === 'matched') out = out.filter(p => p.status === 'green');
    if (activeReason) out = out.filter(p => p.reason === activeReason);
    if (activeUser)   out = out.filter(p => p.users && p.users.includes(activeUser));
    return out;
  }, [products, tab, activeReason, activeUser]);

  // Export — full reason matrix + filtered products
  const exportProductRows = filteredProducts.map(p => ({
    'Product Name': p.name,
    'Reason': p.reason,
    'SO Qty': p.so_qty,
    'SI Qty': p.si_qty,
    'Difference (SO-SI)': p.diff_qty,
    'SO Amount (₹)': Math.round(p.so_amt * scale),
    'SI Amount (₹)': Math.round(p.si_amt * scale),
    'Gap (₹)': Math.round(p.diff_amt * scale),
    'UserName': p.users,
    'Latest Entry Date': p.latest,
    'Status': p.status === 'green' ? 'MATCHED' : p.status === 'orange' ? 'SI > SO' : 'SO > SI',
  }));

  const info = {
    title: 'SI vs SO · Manual Stock Movement Audit',
    what: 'Every manual stock OUT (write-out) must eventually be balanced by a matching stock IN (write-back) for the same reason. When OUT > IN for a reason, that delta is real stock leakage — physical inventory that is unaccounted for. When IN > OUT, it is suspicious — unexplained excess receipts. Only equal flow (within 5%) is operationally healthy.',
    source: '3_Stock___Inwards_SK.xls (' + totals.si_n + ' rows) + 3_Stock_Out_SK.xls (' + totals.so_n + ' rows). Fields: Product, Qty, Reason, TNPRAmt, UserName, EDate.',
    caveat: 'Branch scaling is illustrative — real branches will use their own SI/SO extracts via API. Reason-mapping logic (e.g. "MALLESH DAMAGE" out should map back to "MALLESH DAMAGE" in) is the simplest assumption; a per-branch reason-mapping table can refine this further.',
  };

  return (
    <Card className="overflow-hidden">
      {/* ===== HEADER ===== */}
      <div className="px-5 pt-5 pb-4 border-b hairline">
        <div className="flex flex-wrap items-start justify-between gap-3">
          <div>
            <div className="flex items-center gap-2">
              <span className="text-[11px] uppercase tracking-wider text-muted font-medium">Manual stock movement audit</span>
              <InfoButton info={info} />
            </div>
            <div className="display text-[32px] font-medium num leading-none mt-1.5 text-bad">{rupee(netLeak)}</div>
            <div className="text-[11px] text-muted mt-1">net leakage · OUT {rupee(totalSO)} − IN {rupee(totalSI)}</div>
          </div>
          <ExportButton filename="si_vs_so_audit.csv" rows={exportProductRows} />
        </div>

        {/* Status summary tiles */}
        <div className="grid grid-cols-3 gap-2 mt-4">
          <button
            onClick={() => setTab('all')}
            className={`text-left rounded-xl border-2 p-3 transition ${STATUS_TOKENS.green.ring} ${tab==='all' ? 'bg-ok/5' : 'bg-card hover:bg-ok/5'}`}
          >
            <div className="flex items-center gap-1.5 text-[10px] uppercase tracking-wider text-ok font-medium mb-1">
              <span className="w-1.5 h-1.5 rounded-full bg-ok"></span>Matched
            </div>
            <div className="num text-[15px] font-medium">{rupee(matched)}</div>
            <div className="text-[10px] text-muted mt-0.5">healthy flow</div>
          </button>
          <button
            onClick={() => { setTab('mismatches'); setActiveReason(null); }}
            className={`text-left rounded-xl border-2 p-3 transition ${STATUS_TOKENS.red.ring} ${tab==='mismatches' ? 'bg-bad/5' : 'bg-card hover:bg-bad/5'}`}
          >
            <div className="flex items-center gap-1.5 text-[10px] uppercase tracking-wider text-bad font-medium mb-1">
              <span className="w-1.5 h-1.5 rounded-full bg-bad"></span>SO &gt; SI
            </div>
            <div className="num text-[15px] font-medium text-bad">{rupee(redLeak)}</div>
            <div className="text-[10px] text-muted mt-0.5">pending stock return</div>
          </button>
          <button
            onClick={() => { setTab('mismatches'); setActiveReason(null); }}
            className={`text-left rounded-xl border-2 p-3 transition ${STATUS_TOKENS.orange.ring} ${tab==='mismatches' ? 'bg-warn/5' : 'bg-card hover:bg-warn/5'}`}
          >
            <div className="flex items-center gap-1.5 text-[10px] uppercase tracking-wider text-warn font-medium mb-1">
              <span className="w-1.5 h-1.5 rounded-full bg-warn"></span>SI &gt; SO
            </div>
            <div className="num text-[15px] font-medium text-warn">{rupee(orangeEx)}</div>
            <div className="text-[10px] text-muted mt-0.5">suspicious excess</div>
          </button>
        </div>
      </div>

      {/* ===== REASON MATRIX ===== */}
      <div className="p-4 sm:p-5 border-b hairline">
        <div className="flex items-baseline justify-between mb-3">
          <div className="text-[10.5px] uppercase tracking-wider text-muted font-medium">Reason matrix · tap to filter</div>
          {activeReason && (
            <button onClick={() => setActiveReason(null)} className="text-[10.5px] text-teal hover:underline">clear filter</button>
          )}
        </div>
        <div className="space-y-1.5">
          {matrix.filter(r => r.so_amt > 0 || r.si_amt > 0).map((r) => {
            const tok = STATUS_TOKENS[r.status] || STATUS_TOKENS.green;
            const so = r.so_amt * scale, si = r.si_amt * scale;
            const max = Math.max(so, si, 1);
            const isActive = activeReason === r.reason;
            const diff = r.diff_amt * scale;
            return (
              <button
                key={r.reason}
                onClick={() => setActiveReason(isActive ? null : r.reason)}
                className={`w-full text-left rounded-lg border hairline px-3 py-2.5 transition ${isActive ? 'bg-paper border-ink' : 'bg-card hover:bg-paper'}`}
              >
                {/* Row 1: reason + status chip + delta */}
                <div className="flex items-center justify-between gap-3 mb-2">
                  <div className="flex items-center gap-2 min-w-0">
                    <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${tok.dot}`}></span>
                    <span className="text-[12.5px] font-medium truncate">{r.reason}</span>
                    <span className={`text-[9.5px] uppercase mono px-1.5 py-0.5 rounded shrink-0 font-medium ${tok.chip}`}>
                      {labelFor(r.status, r.so_amt, r.si_amt)}
                    </span>
                  </div>
                  <span className={`num text-[12px] font-medium shrink-0 ${diff > 0 ? 'text-bad' : diff < 0 ? 'text-warn' : 'text-muted'}`}>
                    {diff > 0 ? '−' : diff < 0 ? '+' : ''}{rupee(Math.abs(diff))}
                  </span>
                </div>
                {/* Row 2: dual bar with axis in middle */}
                <div className="flex items-center gap-2">
                  <span className="text-[9.5px] mono text-muted w-8 text-right shrink-0">OUT</span>
                  <div className="flex-1 flex justify-end">
                    <div className="h-2 rounded-l-full bg-bad/75" style={{ width: `${(so / max) * 100}%` }}></div>
                  </div>
                  <div className="w-px h-3 bg-ink shrink-0"></div>
                  <div className="flex-1">
                    <div className="h-2 rounded-r-full bg-teal/75" style={{ width: `${(si / max) * 100}%` }}></div>
                  </div>
                  <span className="text-[9.5px] mono text-muted w-6 shrink-0">IN</span>
                </div>
                {/* Row 3: qty + amount */}
                <div className="flex items-baseline justify-between mt-1.5 text-[10.5px] text-muted">
                  <span>{rupee(so)} · {r.so_qty.toLocaleString('en-IN')} qty</span>
                  <span>{rupee(si)} · {r.si_qty.toLocaleString('en-IN')} qty</span>
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* ===== PRODUCT-LEVEL TABLE ===== */}
      <div className="p-4 sm:p-5 border-b hairline">
        <div className="flex flex-wrap items-baseline justify-between gap-2 mb-3">
          <div className="text-[10.5px] uppercase tracking-wider text-muted font-medium">
            Products{activeReason ? ` · ${activeReason}` : ''}{activeUser ? ` · ${activeUser}` : ''}
            <span className="text-muted/70 font-normal ml-1">({filteredProducts.length})</span>
          </div>
          {/* Tab pills */}
          <div className="flex items-center gap-1 bg-paper border hairline rounded-full p-0.5 text-[10.5px]">
            {[
              { id:'mismatches', label:'Mismatches' },
              { id:'matched',    label:'Matched' },
              { id:'all',        label:'All' },
            ].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`px-2.5 py-1 rounded-full transition ${tab===t.id ? 'bg-ink text-paper' : 'text-muted hover:text-ink'}`}>
                {t.label}
              </button>
            ))}
          </div>
        </div>

        {(activeReason || activeUser) && (
          <button onClick={() => { setActiveReason(null); setActiveUser(null); }}
            className="mb-2 text-[10.5px] text-teal hover:underline">clear filters</button>
        )}

        <div className="border hairline rounded-lg overflow-hidden">
          {/* Header row */}
          <div className="grid grid-cols-12 text-[9.5px] uppercase tracking-wider text-muted font-medium px-3 py-2 bg-paper border-b hairline">
            <div className="col-span-4 sm:col-span-3">Product</div>
            <div className="col-span-3 sm:col-span-2 hidden sm:block">Reason</div>
            <div className="col-span-2 sm:col-span-1 text-right">SO qty</div>
            <div className="col-span-2 sm:col-span-1 text-right">SI qty</div>
            <div className="col-span-2 sm:col-span-2 text-right">Diff</div>
            <div className="col-span-2 hidden sm:block">User</div>
            <div className="col-span-2 sm:col-span-1 hidden sm:block">Latest</div>
          </div>

          {/* Empty state */}
          {filteredProducts.length === 0 && (
            <div className="px-3 py-8 text-center text-[12px] text-muted">No products match the current filter.</div>
          )}

          {/* Rows */}
          {filteredProducts.slice(0, 25).map((p, i) => {
            const tok = STATUS_TOKENS[p.status] || STATUS_TOKENS.green;
            return (
              <div key={i} className={`grid grid-cols-12 text-[11.5px] px-3 py-2.5 ${tok.row} ${i > 0 ? 'border-t hairline' : ''} items-baseline`}>
                <div className="col-span-4 sm:col-span-3 min-w-0">
                  <div className="font-medium truncate">{p.name}</div>
                  <div className="sm:hidden text-[10px] text-muted truncate mt-0.5">{p.reason} · {p.users}</div>
                </div>
                <div className="col-span-3 sm:col-span-2 hidden sm:block text-[10.5px] text-muted truncate">{p.reason}</div>
                <div className="col-span-2 sm:col-span-1 text-right mono">{p.so_qty.toLocaleString('en-IN')}</div>
                <div className="col-span-2 sm:col-span-1 text-right mono">{p.si_qty.toLocaleString('en-IN')}</div>
                <div className={`col-span-2 sm:col-span-2 text-right num font-medium ${p.diff_qty > 0 ? 'text-bad' : p.diff_qty < 0 ? 'text-warn' : 'text-ok'}`}>
                  {p.diff_qty > 0 ? '+' : ''}{p.diff_qty.toLocaleString('en-IN')}
                </div>
                <div className="col-span-2 hidden sm:block text-[10.5px] text-muted truncate">{p.users}</div>
                <div className="col-span-2 sm:col-span-1 hidden sm:block text-[10px] text-muted mono">{p.latest}</div>
              </div>
            );
          })}
        </div>
        {filteredProducts.length > 25 && (
          <div className="text-center mt-2 pt-2 border-t hairline">
            <span className="text-[10.5px] text-muted">Showing 25 of {filteredProducts.length} · use Export to see all</span>
          </div>
        )}
      </div>

      {/* ===== USER ACCOUNTABILITY ===== */}
      <div className="p-4 sm:p-5">
        <div className="flex items-baseline justify-between mb-3">
          <div className="text-[10.5px] uppercase tracking-wider text-muted font-medium">User accountability · tap to filter products</div>
          {activeUser && (
            <button onClick={() => setActiveUser(null)} className="text-[10.5px] text-teal hover:underline">clear filter</button>
          )}
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          {users.slice(0, 8).map((u) => {
            const ret = u.return_pct;
            // return_pct: closer to 100 is healthy, <50% or >150% suspicious
            const status = ret === null ? 'orange'
              : ret >= 95 && ret <= 105 ? 'green'
              : ret < 50 ? 'red'
              : 'orange';
            const tok = STATUS_TOKENS[status];
            const so = u.so_amt * scale, si = u.si_amt * scale;
            const isActive = activeUser === u.name;
            return (
              <button
                key={u.name}
                onClick={() => setActiveUser(isActive ? null : u.name)}
                className={`text-left rounded-lg border-2 p-3 transition ${tok.ring} ${isActive ? 'bg-paper' : 'bg-card hover:bg-paper'}`}
              >
                <div className="flex items-center justify-between gap-2 mb-1.5">
                  <span className="text-[12px] font-medium truncate">{u.name}</span>
                  <span className={`text-[9.5px] uppercase mono px-1.5 py-0.5 rounded font-medium shrink-0 ${tok.chip}`}>
                    {ret === null ? 'IN only' : `${ret.toFixed(0)}% returned`}
                  </span>
                </div>
                <div className="flex items-baseline gap-3 text-[10.5px]">
                  <span className="text-muted">OUT <span className="num text-ink">{rupee(so)}</span> · {u.so_n}</span>
                  <span className="text-muted">IN <span className="num text-ink">{rupee(si)}</span> · {u.si_n}</span>
                </div>
              </button>
            );
          })}
        </div>
        <div className="mt-3 pt-3 border-t hairline text-[11px] text-muted leading-relaxed">
          A healthy user shows ~100% return rate (out and back-in balance over time). Below 50% means stock is taken out and not coming back — investigate. Above 150% (or "IN only") means stock arrives manually without a corresponding out — equally worth a question.
        </div>
      </div>
    </Card>
  );
};

const RiskKpi = ({ label, value, sub, status='ok', info, onClick }) => {
  const ring = { ok:'border-ok/30', amber:'border-warn/40', red:'border-bad/40' }[status] || 'border-rule';
  const dot  = { ok:'bg-ok', amber:'bg-warn', red:'bg-bad' }[status] || 'bg-muted';

        <InfoButton info={info} />

// ---------------------------------------------------------------------
// Pricing Override Register Card — click row to drill into invoice line detail
// ---------------------------------------------------------------------
const PricingOverrideCard = ({ branch, openDrill }) => {
  const scale = scaleFor(branch);
  const sample = REAL.master.negative_billing.sample;

  // Compute per-invoice rollup from the sample (group by InvNo prefix)
  const byInv = useMemo(() => {
    const m = {};
    for (const r of sample) {
      const inv = String(r.InvNo).split('\\')[0];
      if (!m[inv]) m[inv] = { inv, party: r['Ledger Account'], lines: 0, neg_gp_amt: 0, user: r.UserName, updated: r.Updated };
      m[inv].lines += 1;
      const gp = parseFloat(r.GPAmt);
      if (!Number.isNaN(gp) && gp < 0) m[inv].neg_gp_amt += gp;
    }
    return Object.values(m).sort((a,b) => a.neg_gp_amt - b.neg_gp_amt);
  }, [sample]);

// ---------------------------------------------------------------------
// Audit Posture (Deletions) Card — WITH DATE FILTER per v1.2 spec
// ---------------------------------------------------------------------
const AuditPostureCard = ({ branch, openDrill }) => {
  const sample = REAL.master.deletions.sample;

  // Parse 'Deleted On' (DD/MM/YYYY HH:MM:SS) into Date objects once
  const parsed = useMemo(() => sample.map(r => {
    const dt = r['Deleted On'];
    let d = null;
    if (typeof dt === 'string') {
      const m = dt.match(/(\d{2})\/(\d{2})\/(\d{4})/);
      if (m) d = new Date(`${m[3]}-${m[2]}-${m[1]}`);
    }
    return { ...r, _date: d };
  }), [sample]);

  // Date range — defaults to the full April sample window
  const allDates = parsed.map(r => r._date).filter(Boolean);
  const minD = allDates.length ? new Date(Math.min(...allDates.map(d => d.getTime()))) : new Date('2026-04-01');
  const maxD = allDates.length ? new Date(Math.max(...allDates.map(d => d.getTime()))) : new Date('2026-04-30');

  const [from, setFrom] = useState(isoDate(minD));
  const [to, setTo]     = useState(isoDate(maxD));

  const filtered = useMemo(() => {
    const f = new Date(from), t = new Date(to);
    return parsed.filter(r => r._date && r._date >= f && r._date <= t);
  }, [parsed, from, to]);

  // By Mode
  const byMode = useMemo(() => {
    const m = {};
    for (const r of filtered) { m[r.Mode] = (m[r.Mode] || 0) + 1; }
    return Object.entries(m).map(([mode, n]) => ({ mode, n })).sort((a,b) => b.n - a.n);
  }, [filtered]);

  // By User
  const byUser = useMemo(() => {
    const m = {};
    for (const r of filtered) { m[r['Deleted By']] = (m[r['Deleted By']] || 0) + 1; }
    return Object.entries(m).map(([user, n]) => ({ user, n })).sort((a,b) => b.n - a.n);
  }, [filtered]);

  // Scale to monthly equivalent for the branch (sample is 30 records out of 333 for the month)
  const sampleCoverage = filtered.length / parsed.length;
  const projectedMonthly = Math.round(REAL.master.deletions.total * sampleCoverage * (branch === 'group' ? 3.2 : 1));

  const modeMax = Math.max(...byMode.map(m => m.n), 1);

  return (
    <Card className="p-4">
      <SectionHead title="Audit posture · deletions" hint={`${filtered.length} of ${parsed.length} in window · ~${projectedMonthly} extrapolated`}
        info={{
          title:'Voucher deletions — audit posture',
          what:'Deletions logged by Medica ERP across all transaction modes (sales, purchase, cheque, slip). High counts or after-hours deletions indicate weak audit control. v1.2 adds a date filter so you can scope to any window.',
          source:'DAILY_TRANSACTION_DELETED.xlsx · Mode + Deleted On + Deleted By. April logged 333 deletions across 15+ users across the distributor network (this widget shows a 30-record sample, filterable).',
        }} />

      {/* Date filter — v1.2 NEW */}
      <div className="mb-3">
        <DateRangeInputs
          from={from} to={to}
          onFrom={setFrom} onTo={setTo}
          min={isoDate(minD)} max={isoDate(maxD)}
        />
      </div>

      {/* Two-column: by Mode | by User */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <div className="text-[10px] uppercase tracking-wider text-muted mb-2">By transaction mode</div>
          <div className="space-y-1.5">
            {byMode.slice(0, 6).map(m => (
              <div key={m.mode} className="flex items-center gap-2">
                <div className="w-16 text-[11px] mono text-muted shrink-0">{m.mode}</div>
                <div className="flex-1 h-5 bg-paper rounded-sm relative overflow-hidden">
                  <div
                    className="h-full bg-bad/70 rounded-sm transition-all"
                    style={{ width: `${(m.n / modeMax) * 100}%` }}
                  />
                </div>
                <div className="w-8 text-right text-[11.5px] num font-medium">{m.n}</div>
              </div>
            ))}
          </div>
        </div>

        <div>
          <div className="text-[10px] uppercase tracking-wider text-muted mb-2">By user</div>
          <div className="space-y-1.5">
            {byUser.slice(0, 6).map(u => (
              <div key={u.user} className="flex items-center gap-2">
                <div className="w-24 text-[11px] truncate shrink-0">{u.user}</div>
                <div className="flex-1 h-5 bg-paper rounded-sm relative overflow-hidden">
                  <div
                    className="h-full bg-warn/70 rounded-sm transition-all"
                    style={{ width: `${(u.n / (byUser[0]?.n || 1)) * 100}%` }}
                  />
                </div>
                <div className="w-8 text-right text-[11.5px] num font-medium">{u.n}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="mt-3 pt-3 border-t hairline flex items-center justify-between">
        <button
          onClick={() => openDrill('deletions', { from, to })}
          className="text-[11.5px] text-teal font-medium hover:underline"
        >
          View all deletions in window →
        </button>
        <ExportButton
          filename={`deletions_${from}_to_${to}.csv`}
          rows={filtered.map(r => ({ Mode:r.Mode, Inv:r['Inv#'], Party:r.Party, Amount:r.Amount, DeletedOn:r['Deleted On'], DeletedBy:r['Deleted By'] }))}
        />
      </div>
    </Card>
  );
};

              key={i}
              onClick={() => window.__openDrill && window.__openDrill('pendingDn', { supplier: s.name })}
              className="w-full grid grid-cols-12 gap-2 px-2 py-2 rounded-md hover:bg-paper text-left transition items-center"
            >
              <div className="col-span-6 text-[12px] font-medium truncate">{s.name}</div>
              <div className="col-span-2 text-right text-[12px] num">{rupee(s.os * scale)}</div>
              <div className="col-span-1 text-right text-[12px] num text-muted">{s.n}</div>
              <div className="col-span-3 text-right text-[11px] num text-muted">
                <span className={s.oldest_days > 300 ? 'text-bad' : ''}>{s.oldest_days}d</span>
                <span className="text-muted/70"> · {Math.round(s.avg_days)}d</span>
              </div>
            </button>
          ))}
        </div>
      );
    }
  }

  // -------------------- DELETIONS DRILL --------------------
  else if (kind === 'deletions') {
    title = 'Transaction deletions';
    subtitle = payload?.from && payload?.to
      ? `${payload.from} to ${payload.to}`
      : `${REAL.master.deletions.total} this month · sample of ${REAL.master.deletions.sample.length}`;
    const rows = REAL.master.deletions.sample;
    exportName = 'deletions.csv';
    exportRows = rows.map(r => ({
      Mode:r.Mode, Inv:r['Inv#'], InvDate:r.InvDate, Party:r.Party, Trading:r.Trading,
      Amount:r.Amount, Ref:r.Ref, DeletedOn:r['Deleted On'], Username:r['Deleted By']
    }));
    content = (
      <div className="space-y-1">
        <div className="grid grid-cols-12 gap-2 text-[9.5px] uppercase tracking-wider text-muted px-2 pb-1 border-b hairline">
          <div className="col-span-2">Mode · #</div>
          <div className="col-span-4">Party</div>
          <div className="col-span-2 text-right">Amount</div>
          <div className="col-span-2">Deleted on</div>
          <div className="col-span-2">Username</div>
        </div>
        {rows.map((r, i) => (
          <div key={i} className="grid grid-cols-12 gap-2 px-2 py-1.5 hover:bg-paper rounded-md text-[11px] items-start">
            <div className="col-span-2">
              <div className="mono text-[10px] text-bad font-medium">{r.Mode}</div>
              <div className="mono text-[10px] text-muted">{r['Inv#']}</div>
            </div>
            <div className="col-span-4 truncate text-[11.5px]">{r.Party}</div>
            <div className="col-span-2 text-right num">{rupee(parseFloat(r.Amount)||0)}</div>
            <div className="col-span-2 text-[10.5px] text-muted">{r['Deleted On']}</div>
            <div className="col-span-2 text-[11.5px] font-medium text-warn">{r['Deleted By']}</div>
          </div>
        ))}
      </div>
    );
  }

  // -------------------- EXPIRY DRILL --------------------
  else if (kind === 'expiry') {
    title = 'Expiry-risk batches';
    subtitle = 'Next 180 days, own-brand highlighted';
    const sample = [
      { name:'SILYLIFE GOLD 30S TAB', mfr:'Denmark Pharma', val:48200, days:42, own:true },
      { name:'KEFOBACT 1.5GM INJ', mfr:'Denmark Pharma', val:41800, days:67, own:true },
      { name:'LUMEFY CREAM 30GM', mfr:'Denmark Pharma', val:36100, days:88, own:true },
      { name:'FIREUP 30X TAB', mfr:'Denmark Pharma', val:32500, days:55, own:true },
      { name:'JOYTAMIN D3 NANO', mfr:'Denmark Pharma', val:29400, days:103, own:true },
      { name:'PANCRELYZE 10K CAP', mfr:'Abbott', val:18500, days:74, own:false },
      { name:'CYTOLOGE 200MG', mfr:'Cipla', val:14200, days:91, own:false },
      { name:'ROXTEN-N 50/500 TAB', mfr:'Sun Pharma', val:12100, days:118, own:false },
    ];
    exportName = 'expiry_batches.csv';
    exportRows = sample.map(s => ({ Product:s.name, Manufacturer:s.mfr, ValueAtRisk:Math.round(s.val*scale), DaysToExpiry:s.days, OwnBrand:s.own?'Y':'N' }));
    content = (
      <div className="space-y-1">
        <div className="grid grid-cols-12 gap-2 text-[9.5px] uppercase tracking-wider text-muted px-2 pb-1 border-b hairline">
          <div className="col-span-5">Product</div>
          <div className="col-span-3">Manufacturer</div>
          <div className="col-span-2 text-right">Value</div>
          <div className="col-span-2 text-right">Days</div>
        </div>
        {sample.map((b, i) => (
          <div key={i} className={`grid grid-cols-12 gap-2 px-2 py-1.5 rounded-md text-[11.5px] items-center ${b.own ? 'bg-warnSoft/30' : 'hover:bg-paper'}`}>
            <div className="col-span-5 truncate font-medium">{b.name}</div>
            <div className="col-span-3 text-[10.5px] text-muted truncate">{b.mfr}{b.own && <span className="ml-1 text-warn font-medium">· own</span>}</div>
            <div className="col-span-2 text-right num">{rupee(b.val*scale)}</div>
            <div className={`col-span-2 text-right num ${b.days < 60 ? 'text-bad font-medium' : b.days < 90 ? 'text-warn' : 'text-muted'}`}>{b.days}d</div>
          </div>
        ))}
      </div>
    );
  }

  // -------------------- PRICING REGISTER (full list) --------------------
  else if (kind === 'pricing_register') {
    title = 'Pricing override register';
    subtitle = `${REAL.master.negative_billing.total} negative-margin line-items this month`;
    const lines = REAL.master.negative_billing.sample;
    exportName = 'pricing_override_register.csv';
    exportRows = lines.map(r => ({
      InvNo:r.InvNo, Product:r['Product Name'], Pack:r.PACK, Qty:r.Qty, Free:r.Free,
      'GP%':r['GP%'], GPAmt:r.GPAmt, Mode:r['ret '], 'Sch%':r['Sch%'],
      LedgerAccount:r['Ledger Account'], User:r.UserName, Updated:r.Updated
    }));
    content = (
      <div className="space-y-1">
        <div className="grid grid-cols-12 gap-2 text-[9.5px] uppercase tracking-wider text-muted px-2 pb-1 border-b hairline">
          <div className="col-span-2">Inv #</div>
          <div className="col-span-5">Product · party</div>
          <div className="col-span-1 text-right">Qty</div>
          <div className="col-span-1 text-right">Free</div>
          <div className="col-span-2 text-right">GP%</div>
          <div className="col-span-1 text-right">User</div>
        </div>
        {lines.map((r, i) => (
          <div key={i} className="grid grid-cols-12 gap-2 px-2 py-2 hover:bg-paper rounded-md text-[11px] items-start">
            <div className="col-span-2 mono text-[10.5px] text-muted">{r.InvNo}</div>
            <div className="col-span-5 min-w-0">
              <div className="text-[11.5px] font-medium truncate">{r['Product Name']}</div>
              <div className="text-[10.5px] text-muted truncate">{r['Ledger Account']}</div>
            </div>
            <div className="col-span-1 text-right num">{r.Qty}</div>
            <div className="col-span-1 text-right num text-muted">{r.Free}</div>
            <div className={`col-span-2 text-right num ${parseFloat(r['GP%']) < 0 ? 'text-bad font-medium' : 'text-muted'}`}>{r['GP%']}%</div>
            <div className="col-span-1 text-right text-[10.5px] text-muted truncate">{r.UserName}</div>
          </div>
        ))}
      </div>
    );
  }

  // -------------------- PRICING INVOICE DETAIL (Product / QTY / Free / GP% / PTR / CP) --------------------
  else if (kind === 'pricing_invoice') {
    const inv = payload?.inv;
    title = `Invoice #${inv}`;
    subtitle = payload?.party || 'Sales invoice · negative-margin lines';
    const lines = REAL.master.negative_billing.sample.filter(r => String(r.InvNo).split('\\')[0] === String(inv));
    exportName = `invoice_${inv}_lines.csv`;
    exportRows = lines.map(r => ({
      Product:r['Product Name'], Pack:r.PACK, Qty:r.Qty, Free:r.Free,
      'GP%':r['GP%'], PTR_CP:r['ret '], 'Sch%':r['Sch%'], SchAmt:r.SchAmt
    }));
    content = (
      <div>
        <div className="mb-3 p-3 rounded-lg bg-paper border hairline">
          <div className="text-[10.5px] uppercase tracking-wider text-muted mb-1">Per 26-Apr spec</div>
          <div className="text-[11.5px] text-ink leading-relaxed">
            This drill shows only the columns required for owner review: Product Name, QTY, Free, GP%, PTR/CP basis.
            The maker-checker workflow in the new ERP will block negative GP% lines unless an approver releases them.
          </div>
        </div>
        <div className="space-y-1">
          <div className="grid grid-cols-12 gap-2 text-[9.5px] uppercase tracking-wider text-muted px-2 pb-1 border-b hairline">
            <div className="col-span-5">Product</div>
            <div className="col-span-1 text-right">QTY</div>
            <div className="col-span-1 text-right">Free</div>
            <div className="col-span-2 text-right">GP%</div>
            <div className="col-span-2 text-right">GP ₹</div>
            <div className="col-span-1 text-right">Basis</div>
          </div>
          {lines.map((r, i) => (
            <div key={i} className="grid grid-cols-12 gap-2 px-2 py-2 rounded-md text-[11.5px] items-start bg-paper/40 hover:bg-paper">
              <div className="col-span-5 min-w-0">
                <div className="font-medium truncate">{r['Product Name']}</div>
                <div className="text-[10.5px] text-muted">{r.PACK} · {r['Parent Manufacturer']}</div>
              </div>
              <div className="col-span-1 text-right num">{r.Qty}</div>
              <div className="col-span-1 text-right num text-muted">{r.Free}</div>
              <div className={`col-span-2 text-right num ${parseFloat(r['GP%']) < 0 ? 'text-bad font-medium' : 'text-muted'}`}>{r['GP%']}%</div>
              <div className={`col-span-2 text-right num ${parseFloat(r.GPAmt) < 0 ? 'text-bad' : 'text-muted'}`}>{r.GPAmt}</div>
              <div className="col-span-1 text-right mono text-[10.5px] text-muted">{r['ret ']}</div>
            </div>
          ))}
          {lines.length === 0 && (
            <div className="py-8 text-center text-[12px] text-muted">No lines found for this invoice in the sample.</div>
          )}
        </div>
      </div>
    );
  }

  // ---------------------------------------------------------------------
  // RENDER
  // ---------------------------------------------------------------------
  return (
    <>
      <div className="fixed inset-0 bg-black/40 z-40 anim-fade" onClick={onClose} />
      <div
        className="fixed z-50 bg-card shadow-2xl
          inset-x-0 bottom-0 max-h-[88vh] rounded-t-2xl anim-sheet
          sm:inset-y-0 sm:right-0 sm:left-auto sm:bottom-auto sm:top-0 sm:max-h-none sm:w-[min(620px,calc(100vw-2rem))] sm:rounded-none sm:rounded-l-2xl sm:anim-fade
          flex flex-col"
      >
        {/* Header */}
        <div className="px-5 pt-4 pb-3 border-b hairline shrink-0">
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0 flex-1">
              <div className="display text-lg font-medium leading-snug truncate">{title}</div>
              {subtitle && <div className="text-[11.5px] text-muted mt-0.5 truncate">{subtitle}</div>}
            </div>
            <button onClick={onClose} className="text-muted hover:text-ink text-2xl leading-none -mt-1 px-2 shrink-0" aria-label="Close">×</button>
          </div>
          {exportRows.length > 0 && (
            <div className="mt-2 flex justify-end">
              <ExportButton filename={exportName} rows={exportRows} label="Export to Excel" />
            </div>
          )}
        </div>

        {/* Scrollable body */}
        <div className="flex-1 overflow-y-auto px-5 py-4 pb-[max(1rem,env(safe-area-inset-bottom))]">
          {content || <div className="py-12 text-center text-muted text-sm">No detail available.</div>}
        </div>
      </div>
    </>
  );
};

// =====================================================================
// MAIN APP
// =====================================================================
const App = () => {
  const [tab, setTab]       = useState('home');
  const [branch, setBranch] = useState('group');
  const [period, setPeriod] = useState('MTD');
  const [drill, setDrill]   = useState({ open:false, kind:null, payload:null });

  const openDrill = (kind, payload = null) => setDrill({ open:true, kind, payload });
  const closeDrill = () => setDrill({ open:false, kind:null, payload:null });

  // Expose to drill sheet for nested clicks (customer-bills, supplier-detail, etc.)
  useEffect(() => { window.__openDrill = openDrill; return () => { delete window.__openDrill; }; }, []);

  let view = null;
  if (tab === 'home')        view = <ViewHome  branch={branch} openDrill={openDrill} />;
  else if (tab === 'sales')  view = <ViewSales branch={branch} />;
  else if (tab === 'money')  view = <ViewMoney branch={branch} openDrill={openDrill} />;
  else if (tab === 'stock')  view = <ViewStock branch={branch} />;
  else if (tab === 'risk')   view = <ViewRisk  branch={branch} openDrill={openDrill} />;

  return (
    <div className="min-h-screen">
      <Header branch={branch} setBranch={setBranch} period={period} setPeriod={setPeriod} />
      <TabBar tab={tab} setTab={setTab} />
      {view}
      <DrillSheet open={drill.open} onClose={closeDrill} branch={branch} kind={drill.kind} payload={drill.payload} />
    </div>
  );
};

// Mount
const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);

</script>
</body>
</html>
